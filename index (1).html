<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملفات اللغة الإنجليزية لكل المراحل</title>
<meta name="description" content="شاهد عينة من الملف قبل الطلب. الملف 50 ج والوحدة كاملة 150 ج.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#132238;--paper:#fbfcfe;--rule:#d9e5f4;--margin:#e5484d;--hl:#ffe14d;--pencil:#12805c;--mu:#5d6b82;--bd:#dde5f0;--wa:#25d366}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:"Readex Pro",Tahoma,Arial,sans-serif;background:#f1f5fb;color:var(--ink);line-height:1.6;padding-bottom:110px;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}

/* الغلاف: ورقة كراسة */
.hero{position:relative;background:var(--paper);background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);border-bottom:2px solid var(--ink);padding:32px 20px 0}
.hero::before{content:"";position:absolute;top:0;bottom:0;right:14px;width:2px;background:var(--margin);opacity:.55}
.hero-in{max-width:880px;margin:0 auto;padding-right:22px}
.hero h1{font-size:clamp(24px,6vw,38px);line-height:64px;font-weight:700;letter-spacing:-.01em}
.hero p{line-height:32px;color:var(--mu);font-size:15px;max-width:520px}
.prices{display:flex;gap:12px;flex-wrap:wrap;margin:32px 0}
.price{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 16px;display:flex;align-items:baseline;gap:10px;box-shadow:3px 3px 0 var(--ink)}
.price mark{background:linear-gradient(transparent 35%,var(--hl) 35% 90%,transparent 90%);font-size:30px;font-weight:700;padding:0 4px;line-height:1.2}
.price small{font-size:14px;color:var(--mu)}
.price em{font-style:normal;font-size:12px;font-weight:600;background:var(--ink);color:#fff;border-radius:99px;padding:1px 9px}
.steps{display:flex;gap:6px 22px;flex-wrap:wrap;font-size:14px;color:var(--ink);padding-bottom:20px;line-height:32px}
.steps li{list-style:none;display:flex;gap:8px;align-items:center}
.steps b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px}

/* التنقل */
nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--bd)}
.nav-in{max-width:880px;margin:0 auto}
.stages{display:flex}
.stages button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:14px 8px;font-weight:600;color:var(--mu);font-size:16px}
.stages button.on{color:var(--ink);border-color:var(--ink)}
.grades{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.grades::-webkit-scrollbar{display:none}
.grades button{flex:0 0 auto;border:1px solid var(--bd);background:#fff;border-radius:99px;padding:6px 16px;font-size:14px;white-space:nowrap}
.grades button.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* الوحدات */
main{max-width:880px;margin:0 auto;padding:20px 14px}
.gt{font-size:20px;font-weight:700;margin:4px 4px 14px}
.unit{background:#fff;border:1px solid var(--bd);border-inline-start:4px solid var(--margin);border-radius:12px;margin-bottom:18px;overflow:hidden}
.uh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--bd);background:var(--paper)}
.uh h3{font-size:17px;font-weight:600}
.bundle{background:var(--hl);border:2px solid var(--ink);border-radius:8px;padding:6px 14px;font-weight:600;font-size:14px}
.bundle small{font-weight:400;margin-inline-start:6px}
.bundle.done{background:var(--pencil);color:#fff;border-color:var(--pencil)}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.row.sel{background:#effaf4}
.ic{width:40px;height:40px;border-radius:10px;background:#eef3fb;display:grid;place-items:center;font-size:20px}
.row.sel .ic{background:#d3f0e0}
.nm b{display:block;font-weight:500;font-size:15px}
.nm span{font-size:13px;color:var(--mu)}
.act{display:flex;gap:8px}
.act button{border-radius:8px;padding:7px 14px;font-size:14px;border:1.5px solid var(--ink);background:#fff;transition:background .15s}
.act .add{background:var(--ink);color:#fff}
.row.sel .add{background:var(--pencil);border-color:var(--pencil)}
.act button:active{transform:scale(.97)}
@media(max-width:480px){.row{grid-template-columns:36px 1fr}.act{grid-column:1/-1}.act button{flex:1}.ic{width:36px;height:36px}}

/* سلة الطلب */
#cart{position:fixed;right:0;left:0;bottom:0;z-index:30;transform:translateY(110%);transition:transform .25s}
#cart.show{transform:none}
#list{max-height:40vh;overflow:auto;background:#fff;border-top:2px solid var(--ink);display:none;padding:6px 16px}
#cart.open #list{display:block}
#list div{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
#list button{border:0;background:none;color:var(--margin);font-size:20px;padding:0 6px}
.bar{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar .info{background:none;border:0;color:#fff;text-align:start;line-height:1.3}
.bar .info small{display:block;opacity:.7;font-size:12px}
.bar .info strong{font-size:20px}
.send{background:var(--wa);color:#06361b;border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-size:15px}

/* المعاينة */
#modal{position:fixed;inset:0;z-index:50;background:rgba(19,34,56,.7);display:none;padding:10px}
#modal.show{display:flex;flex-direction:column;max-width:900px;margin:0 auto}
#modal .top{background:var(--ink);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-radius:12px 12px 0 0}
#modal .top button{background:#fff;border:0;border-radius:8px;padding:6px 14px;color:var(--ink);font-weight:600}
#modal iframe{flex:1;border:0;background:#fff;border-radius:0 0 12px 12px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:10px 16px 20px}
footer a{color:var(--ink);font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <h1>ملفات اللغة الإنجليزية</h1>
    <p>ابتدائي وإعدادي وثانوي. جرامر وكلمات وقصة وقراءة واستماع لكل وحدة.</p>
    <div class="prices">
      <div class="price"><mark>50</mark><small>ج للملف الواحد</small></div>
      <div class="price"><mark>150</mark><small>ج للوحدة كاملة</small><em>وفّر 100 ج</em></div>
    </div>
    <ol class="steps">
      <li><b>1</b>اختر الصف والوحدة</li>
      <li><b>2</b>شاهد العينة</li>
      <li><b>3</b>أرسل الطلب على واتساب</li>
    </ol>
  </div>
</header>

<nav><div class="nav-in"><div class="stages" id="tabs"></div><div class="grades" id="grades"></div></div></nav>
<main id="units"></main>
<footer>للاستفسار كلمنا على <a id="wl" href="#">واتساب</a></footer>

<div id="cart">
  <div id="list"></div>
  <div class="bar">
    <button class="info" id="toggle" aria-expanded="false"><small id="cnt"></small><strong><span id="tot"></span> ج</strong></button>
    <button class="send" id="send">اطلب على واتساب</button>
  </div>
</div>

<div id="modal" role="dialog" aria-modal="true">
  <div class="top"><b id="mt"></b><button onclick="closeP()">إغلاق</button></div>
  <iframe id="fr" title="معاينة العينة"></iframe>
</div>

<script>
/* ===== إعدادات تعدّلها أنت ===== */
const PHONE="201004197054";
const FILE_PRICE=50, UNIT_PRICE=150;
const FOLDER="samples/";
const STAGES={
  "ابتدائي":{"الصف الأول":6,"الصف الثاني":6,"الصف الثالث":6,"الصف الرابع":6,"الصف الخامس":6,"الصف السادس":6},
  "إعدادي":{"الصف الأول الإعدادي":6,"الصف الثاني الإعدادي":6,"الصف الثالث الإعدادي":6},
  "ثانوي":{"الصف الأول الثانوي":6,"الصف الثاني الثانوي":6,"الصف الثالث الثانوي":6}
};
const TYPES=[["grammar","جرامر","📝"],["vocab","كلمات","🔤"],["story","قصة","📖"],["reading","دروس قراءة","👓"],["listening","استماع","🎧"]];
/* اسم ملف العينة: samples/<مرحلة>-<صف>-u<وحدة>-<نوع>.html  مثال: samples/1-1-u1-grammar.html */
/* ================================= */

const $=id=>document.getElementById(id);
const stageNames=Object.keys(STAGES);
let stage=stageNames[0], grade=Object.keys(STAGES[stage])[0];
const sel=new Map();
$("wl").href="https://wa.me/"+PHONE;

function render(){
  $("tabs").innerHTML=stageNames.map(s=>`<button class="${s==stage?'on':''}" onclick="setStage('${s}')">${s}</button>`).join("");
  $("grades").innerHTML=Object.keys(STAGES[stage]).map(g=>`<button class="${g==grade?'on':''}" onclick="setGrade('${g}')">${g}</button>`).join("");
  const si=stageNames.indexOf(stage)+1, gi=Object.keys(STAGES[stage]).indexOf(grade)+1;
  let h=`<h2 class="gt">${grade}</h2>`;
  for(let u=1;u<=STAGES[stage][grade];u++){
    const keys=TYPES.map(([t])=>`${si}-${gi}-u${u}-${t}`);
    const all=keys.every(k=>sel.has(k));
    h+=`<section class="unit"><div class="uh"><h3>الوحدة ${u}</h3>
      <button class="bundle ${all?'done':''}" onclick="unitToggle(${si},${gi},${u})">${all?'✓ الوحدة كاملة':'الوحدة كاملة <small>'+UNIT_PRICE+' ج</small>'}</button></div>`;
    TYPES.forEach(([t,n,e],i)=>{
      const k=keys[i], on=sel.has(k);
      h+=`<div class="row ${on?'sel':''}"><div class="ic">${e}</div>
        <div class="nm"><b>${n}</b><span>${FILE_PRICE} ج</span></div>
        <div class="act"><button onclick="preview('${k}','${n} - الوحدة ${u}')">عينة</button>
        <button class="add" onclick="toggle('${k}')">${on?'✓ تمت الإضافة':'أضف للطلب'}</button></div></div>`;
    });
    h+=`</section>`;
  }
  $("units").innerHTML=h; cart();
}
function setStage(s){stage=s;grade=Object.keys(STAGES[s])[0];render();scrollTo(0,document.querySelector('nav').offsetTop)}
function setGrade(g){grade=g;render()}
function info(k){const[a,b,c,d]=k.split("-");const s=stageNames[a-1];const g=Object.keys(STAGES[s])[b-1];return{s,g,u:c.slice(1),t:TYPES.find(x=>x[0]==d)[1]}}
function toggle(k){sel.has(k)?sel.delete(k):sel.set(k,info(k));render()}
function unitToggle(si,gi,u){
  const keys=TYPES.map(([t])=>`${si}-${gi}-u${u}-${t}`);
  const all=keys.every(k=>sel.has(k));
  keys.forEach(k=>all?sel.delete(k):sel.set(k,info(k)));render();
}
function groups(){const m={};sel.forEach(v=>{const k=`${v.s} - ${v.g} - الوحدة ${v.u}`;(m[k]=m[k]||[]).push(v.t)});return m}
function total(){let t=0;Object.values(groups()).forEach(a=>t+=Math.min(a.length*FILE_PRICE,UNIT_PRICE));return t}
function cart(){
  $("cart").classList.toggle("show",sel.size>0);
  if(!sel.size)$("cart").classList.remove("open");
  $("cnt").textContent=sel.size+" ملف في الطلب • اضغط للتفاصيل";
  $("tot").textContent=total();
  $("list").innerHTML=[...sel].map(([k,v])=>`<div><span>${v.t} • ${v.g} • وحدة ${v.u}</span><button onclick="toggle('${k}')" aria-label="حذف">×</button></div>`).join("");
}
$("toggle").onclick=()=>{const o=$("cart").classList.toggle("open");$("toggle").setAttribute("aria-expanded",o)};
$("send").onclick=()=>{
  let m="السلام عليكم، عايز أطلب الملفات دي:\n\n";
  const g=groups();
  for(const k in g)m+=`• ${k}\n   ${g[k].length==TYPES.length?'الوحدة كاملة':g[k].join(' + ')}\n`;
  m+=`\nالإجمالي: ${total()} ج`;
  window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(m)}`,"_blank");
};
function preview(k,t){$("mt").textContent="عينة: "+t;$("fr").src=FOLDER+k+".html";$("modal").classList.add("show")}
function closeP(){$("modal").classList.remove("show");$("fr").src="about:blank"}
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeP()});
render();
</script>
</body>
</html>
